<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training Assistant — Fitness Sync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    /* ── Chat-specific layout ── */
    .chat-shell {
      display: grid;
      grid-template-columns: 240px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Main chat area ── */
    .chat-main {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-width: 0;
    }

    .chat-header {
      padding: 18px 28px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .chat-header-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--primary);
      display: grid; place-items: center;
      font-family: var(--font-display);
      font-weight: 700;
      color: #0A0908;
      font-size: 14px;
      flex-shrink: 0;
    }
    .chat-header-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
    }
    .chat-header-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-mute);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* ── Message thread ── */
    .chat-thread {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Empty state ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      padding: 40px;
    }
    .empty-icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      display: grid; place-items: center;
      font-size: 26px;
    }
    .empty-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.03em;
    }
    .empty-sub {
      color: var(--text-mute);
      font-size: 13.5px;
      max-width: 380px;
      line-height: 1.6;
    }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 540px;
    }
    .suggestion {
      font-family: var(--font-body);
      font-size: 13px;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--line-strong);
      background: var(--surface-1);
      color: var(--text-dim);
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      text-align: left;
    }
    .suggestion:hover {
      background: var(--surface-2);
      border-color: var(--text-mute);
      color: var(--text);
    }

    /* ── Message bubbles ── */
    .message {
      display: flex;
      flex-direction: column;
      max-width: 72%;
      animation: fadeUp .3s ease-out backwards;
    }
    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }
    .message.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-mute);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .msg-meta .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
    }
    .message.user .msg-meta .dot { background: var(--primary); }
    .message.assistant .msg-meta .dot { background: var(--tertiary); }

    .msg-bubble {
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    .message.user .msg-bubble {
      background: var(--primary);
      color: #0A0908;
      border-bottom-right-radius: 3px;
      font-weight: 500;
    }
    .message.assistant .msg-bubble {
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--text);
      border-bottom-left-radius: 3px;
    }

    /* Cited activities */
    .cited {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .cited-tag {
      font-family: var(--font-mono);
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(111,179,255,0.08);
      border: 1px solid rgba(111,179,255,0.2);
      color: var(--quaternary);
    }

    /* Typing indicator */
    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 16px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      border-bottom-left-radius: 3px;
      width: fit-content;
    }
    .typing span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-mute);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .5; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Input bar ── */
    .chat-input-wrap {
      flex-shrink: 0;
      padding: 16px 28px 20px;
      border-top: 1px solid var(--line);
      background: var(--bg);
    }
    .chat-input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface-1);
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 10px 10px 10px 16px;
      transition: border-color .15s;
    }
    .chat-input-row:focus-within {
      border-color: var(--text-mute);
    }
    #question {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      max-height: 160px;
      min-height: 24px;
      overflow-y: auto;
    }
    #question::placeholder { color: var(--text-faint); }
    #send-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: var(--primary);
      display: grid; place-items: center;
      flex-shrink: 0;
      transition: background .15s, opacity .15s;
    }
    #send-btn:hover { background: var(--primary-soft); }
    #send-btn:disabled { opacity: 0.35; pointer-events: none; }
    #send-btn svg { width: 16px; height: 16px; fill: #0A0908; }
    .input-hint {
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-faint);
      text-align: center;
      letter-spacing: 0.06em;
    }

    /* Error bubble */
    .msg-error {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--primary-soft);
      padding: 10px 14px;
      border: 1px solid rgba(255,68,35,0.25);
      border-radius: 8px;
      background: rgba(255,68,35,0.06);
    }
  </style>
</head>
<body>
<div class="chat-shell">

  <!-- ── Sidebar rail ── -->
  <nav class="rail">
    <div class="brand">
      <div class="brand-mark">F</div>
      <div>
        <div class="brand-name">FitSync</div>
        <div class="brand-sub">Training OS</div>
      </div>
    </div>

    <div class="nav">
      <div class="nav-section">Navigate</div>
      <a href="/report" style="text-decoration:none">
        <button class="nav-item">
          <span class="nav-dot"></span>
          Weekly Report
        </button>
      </a>
      <a href="/chat" style="text-decoration:none">
        <button class="nav-item active">
          <span class="nav-dot"></span>
          AI Assistant
        </button>
      </a>
      <a href="/docs" style="text-decoration:none">
        <button class="nav-item">
          <span class="nav-dot"></span>
          API Docs
        </button>
      </a>
    </div>

    <div class="rail-footer">
      <div class="platform-chip ok">
        <span class="pc-dot"></span>
        <span class="pc-name">Strava</span>
        <span class="pc-sub">connected</span>
      </div>
      <div class="platform-chip ok">
        <span class="pc-dot"></span>
        <span class="pc-name">Gemini</span>
        <span class="pc-sub">active</span>
      </div>
    </div>
  </nav>

  <!-- ── Chat main ── -->
  <div class="chat-main">
    <div class="chat-header">
      <div class="chat-header-icon">AI</div>
      <div>
        <div class="chat-header-title">Training Assistant</div>
        <div class="chat-header-sub">Powered by Gemini · grounded in your data</div>
      </div>
    </div>

    <div class="chat-thread" id="thread">
      <!-- Empty state shown until first message -->
      <div class="empty-state" id="empty">
        <div class="empty-icon">🏃</div>
        <div>
          <div class="empty-title">Ask about your training</div>
          <div class="empty-sub">I have access to all your Strava activities and Garmin data. Ask me anything.</div>
        </div>
        <div class="suggestions">
          <button class="suggestion" onclick="sendSuggestion(this)">How has my running pace trended recently?</button>
          <button class="suggestion" onclick="sendSuggestion(this)">What was my best week this month?</button>
          <button class="suggestion" onclick="sendSuggestion(this)">How is my sleep affecting my performance?</button>
          <button class="suggestion" onclick="sendSuggestion(this)">Show me my longest runs</button>
          <button class="suggestion" onclick="sendSuggestion(this)">How much did I train this week?</button>
          <button class="suggestion" onclick="sendSuggestion(this)">What's my average heart rate on long runs?</button>
        </div>
      </div>
    </div>

    <div class="chat-input-wrap">
      <div class="chat-input-row">
        <textarea
          id="question"
          rows="1"
          placeholder="Ask about your training…"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
        <button id="send-btn" onclick="sendMessage()" title="Send (Enter)">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
    </div>
  </div>

</div>

<script>
  const thread = document.getElementById('thread');
  const textarea = document.getElementById('question');
  const sendBtn = document.getElementById('send-btn');
  const empty = document.getElementById('empty');

  // Auto-resize textarea
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
  });

  // Enter to send, Shift+Enter for newline
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function sendSuggestion(btn) {
    textarea.value = btn.textContent;
    sendMessage();
  }

  function hideEmpty() {
    if (empty) {
      empty.style.display = 'none';
    }
  }

  function appendMessage(role, content, citedIds = []) {
    hideEmpty();
    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.innerHTML = `<span class="dot"></span>${role === 'user' ? 'You' : 'Assistant'}`;
    msg.appendChild(meta);

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = content;
    msg.appendChild(bubble);

    if (citedIds.length > 0) {
      const cited = document.createElement('div');
      cited.className = 'cited';
      citedIds.forEach(id => {
        const tag = document.createElement('span');
        tag.className = 'cited-tag';
        tag.textContent = id.slice(0, 8) + '…';
        tag.title = id;
        cited.appendChild(tag);
      });
      msg.appendChild(cited);
    }

    thread.appendChild(msg);
    thread.scrollTop = thread.scrollHeight;
    return msg;
  }

  function appendTyping() {
    hideEmpty();
    const wrap = document.createElement('div');
    wrap.className = 'message assistant';
    wrap.id = 'typing-indicator';

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.innerHTML = '<span class="dot"></span>Assistant';
    wrap.appendChild(meta);

    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    wrap.appendChild(typing);

    thread.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
    return wrap;
  }

  function removeTyping() {
    const indicator = document.getElementById('typing-indicator');
    if (indicator) indicator.remove();
  }

  function appendError(message) {
    hideEmpty();
    const wrap = document.createElement('div');
    wrap.className = 'message assistant';

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.innerHTML = '<span class="dot"></span>Assistant';
    wrap.appendChild(meta);

    const err = document.createElement('div');
    err.className = 'msg-error';
    err.textContent = message;
    wrap.appendChild(err);

    thread.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
  }

  async function sendMessage() {
    const question = textarea.value.trim();
    if (!question) return;

    textarea.value = '';
    textarea.style.height = 'auto';
    sendBtn.disabled = true;

    appendMessage('user', question);
    const typingEl = appendTyping();

    try {
      const resp = await fetch('/assistant/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });

      removeTyping();

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        appendError(err.detail || `Error ${resp.status} — check your GEMINI_API_KEY in .env`);
      } else {
        const { answer, cited_activities } = await resp.json();
        appendMessage('assistant', answer, cited_activities || []);
      }
    } catch (e) {
      removeTyping();
      appendError('Network error — is the server running?');
    } finally {
      sendBtn.disabled = false;
      textarea.focus();
    }
  }

  // Focus textarea on load
  textarea.focus();
</script>
</body>
</html>
