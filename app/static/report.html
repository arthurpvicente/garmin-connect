<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Report — Fitness Sync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    body { max-width: 860px; margin: 0 auto; padding: 32px 24px 64px; }

    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 36px; padding-bottom: 20px; border-bottom: 1px solid var(--line);
    }
    .page-header h1 {
      font-family: var(--font-display); font-weight: 700;
      font-size: 28px; letter-spacing: -0.03em; margin: 0;
    }
    .week-nav { display: flex; align-items: center; gap: 12px; }
    .week-nav button {
      background: var(--surface-1); border: 1px solid var(--line);
      color: var(--text); padding: 6px 12px; border-radius: 6px;
      font-family: var(--font-mono); font-size: 12px; cursor: pointer;
    }
    .week-nav button:hover { background: var(--surface-2); }
    .week-nav button:disabled { opacity: 0.3; cursor: default; }
    .week-label {
      font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);
      min-width: 180px; text-align: center;
    }

    .grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 600px) { .grid-2x2 { grid-template-columns: 1fr; } }

    .report-card { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; }
    .card-icon { font-size: 22px; margin-bottom: 12px; }
    .card-title {
      font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.14em; color: var(--text-mute); margin-bottom: 16px;
    }

    .stat-row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
    .stat-row:first-of-type { border-top: none; padding-top: 0; }
    .stat-key { font-size: 13px; color: var(--text-dim); }
    .stat-val { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -0.025em; }
    .stat-unit { font-family: var(--font-mono); font-size: 11px; color: var(--text-mute); margin-left: 3px; font-weight: 400; }

    .big-number {
      font-family: var(--font-display); font-weight: 700;
      font-size: 56px; letter-spacing: -0.04em; line-height: 1;
      color: var(--primary); margin-bottom: 4px;
    }
    .big-unit { font-family: var(--font-mono); font-size: 14px; color: var(--text-mute); margin-left: 4px; font-weight: 400; }

    .summary-row {
      background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-lg);
      display: grid; grid-template-columns: repeat(4, 1fr);
    }
    .summary-cell { padding: 20px 22px; border-right: 1px solid var(--line); }
    .summary-cell:last-child { border-right: none; }
    @media (max-width: 600px) { .summary-row { grid-template-columns: 1fr 1fr; } .summary-cell:nth-child(2) { border-right: none; } }

    .no-data { color: var(--text-mute); font-family: var(--font-mono); font-size: 12px; padding: 8px 0; }

    .hrv-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .hrv-pill {
      font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.1em; padding: 4px 10px; border-radius: 20px;
      border: 1px solid var(--line);
    }
    .hrv-pill.balanced { color: var(--tertiary); border-color: rgba(0,229,160,0.3); background: rgba(0,229,160,0.07); }
    .hrv-pill.strained { color: var(--warn); border-color: rgba(255,193,7,0.3); background: rgba(255,193,7,0.07); }
    .hrv-pill.poor, .hrv-pill.compromised { color: var(--primary); border-color: rgba(255,68,35,0.3); background: rgba(255,68,35,0.07); }

    .loading { text-align: center; padding: 80px 0; font-family: var(--font-mono); font-size: 12px; color: var(--text-mute); letter-spacing: 0.12em; text-transform: uppercase; }
    .error-msg { background: rgba(255,68,35,0.1); border: 1px solid rgba(255,68,35,0.3); border-radius: 8px; padding: 16px 20px; color: var(--primary); font-size: 13px; margin-top: 24px; }
    .connect-hint { font-family: var(--font-mono); font-size: 11px; color: var(--text-mute); margin-top: 8px; }

    .no-garmin { font-family: var(--font-mono); font-size: 11px; color: var(--text-mute); margin-top: 8px; line-height: 1.6; }

    /* Highlight banner */
    .highlight {
      background: linear-gradient(135deg, rgba(255,68,35,0.12), rgba(255,193,7,0.08));
      border: 1px solid rgba(255,68,35,0.3);
      border-radius: var(--r-lg); padding: 16px 22px; margin-bottom: 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .highlight .h-icon { font-size: 22px; }
    .highlight .h-label { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-mute); }
    .highlight .h-text { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: -0.015em; color: var(--text); margin-top: 2px; }

    /* Week-over-week comparison */
    .comparison {
      background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-lg);
      padding: 18px 22px; margin-bottom: 16px;
    }
    .cmp-title { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-mute); margin-bottom: 12px; }
    .cmp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .cmp-item { display: flex; flex-direction: column; gap: 2px; }
    .cmp-key { font-size: 11px; color: var(--text-mute); font-family: var(--font-mono); }
    .cmp-val { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
    .cmp-delta { font-family: var(--font-mono); font-size: 11px; }
    .cmp-delta.up { color: var(--tertiary); }
    .cmp-delta.down { color: var(--primary); }
    .cmp-delta.neutral { color: var(--text-mute); }

    /* Sport cards grid */
    .sports-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 16px; }

    /* PRs */
    .prs-card { background: var(--surface-1); border: 1px solid rgba(255,193,7,0.3); border-radius: var(--r-lg); padding: 20px 22px; margin-bottom: 16px; }
    .pr-row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .pr-row:first-of-type { border-top: none; padding-top: 0; }
    .pr-name { color: var(--text-dim); }
    .pr-value { font-family: var(--font-display); font-weight: 700; color: var(--warn); }

    /* Day-by-day */
    .daily-card { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px 22px; margin-bottom: 16px; }
    .daily-grid { display: grid; grid-template-columns: 1fr; gap: 0; }
    .day-row { display: grid; grid-template-columns: 50px 1fr auto; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); align-items: center; }
    .day-row:first-of-type { border-top: none; padding-top: 0; }
    .day-row.rest { opacity: 0.4; }
    .day-name { font-family: var(--font-mono); font-size: 11px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.1em; }
    .day-summary { font-size: 13px; color: var(--text); }
    .day-duration { font-family: var(--font-mono); font-size: 11px; color: var(--text-mute); }
  </style>
</head>
<body>

<div class="page-header">
  <div>
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:6px">Fitness Sync</div>
    <h1>Weekly Report</h1>
  </div>
  <div class="week-nav">
    <button id="btn-prev">◀ Prev</button>
    <div class="week-label" id="week-label">Loading…</div>
    <button id="btn-next" disabled>Next ▶</button>
    <button id="btn-pdf" disabled style="background:var(--primary);border-color:var(--primary);color:#0A0908;font-weight:600">↓ PDF</button>
    <button id="btn-wa" disabled style="background:#25D366;border-color:#25D366;color:#fff;font-weight:600">✈ WhatsApp</button>
  </div>
</div>

<div id="content"><div class="loading">Loading your week…</div></div>

<script>
let weekOffset = 0;
let userId = null;

async function init() {
  try {
    const me = await fetch('/auth/me').then(r => r.json());
    if (me.detail) throw new Error(me.detail);
    userId = me.id;
    await loadWeek();
  } catch (e) {
    document.getElementById('content').innerHTML = `
      <div class="error-msg">
        <strong>Not connected yet.</strong><br>
        <span class="connect-hint">Visit <a href="/auth/strava/login" style="color:var(--primary)">Strava login</a> to connect your account first.</span>
      </div>`;
    document.getElementById('week-label').textContent = '—';
  }
}

async function loadWeek() {
  document.getElementById('content').innerHTML = '<div class="loading">Loading…</div>';
  document.getElementById('btn-prev').disabled = true;
  document.getElementById('btn-next').disabled = true;

  const r = await fetch(`/analytics/weekly-report?user_id=${userId}&week_offset=${weekOffset}`);
  const d = await r.json();

  document.getElementById('week-label').textContent = d.week_label;
  document.getElementById('btn-prev').disabled = false;
  document.getElementById('btn-next').disabled = weekOffset >= 0;
  document.getElementById('btn-pdf').disabled = false;
  document.getElementById('btn-wa').disabled = false;

  document.getElementById('content').innerHTML = render(d);
}

function val(v, unit = '', fallback = '—') {
  if (v === null || v === undefined) return `<span style="color:var(--text-mute)">${fallback}</span>`;
  return `${v}<span class="stat-unit">${unit}</span>`;
}

function renderHRV(breakdown) {
  if (!breakdown || Object.keys(breakdown).length === 0) return '';
  return '<div class="hrv-pills">' +
    Object.entries(breakdown).map(([k, v]) =>
      `<span class="hrv-pill ${k.toLowerCase()}">${v}× ${k}</span>`
    ).join('') +
    '</div>';
}

function deltaSpan(value, suffix = '', invertColor = false) {
  if (value === null || value === undefined || value === 0) return '';
  const positive = value > 0;
  const better = invertColor ? !positive : positive;
  const cls = better ? 'up' : 'down';
  const arrow = positive ? '↑' : '↓';
  const sign = positive ? '+' : '';
  return `<span class="cmp-delta ${cls}">${arrow} ${sign}${value}${suffix}</span>`;
}

function fmtTime(mins) {
  if (!mins) return '0 min';
  const h = Math.floor(mins / 60), m = mins % 60;
  return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m} min`;
}

function distanceCard(emoji, title, data) {
  if (!data || data.sessions === 0) return '';
  return `
    <div class="report-card">
      <div class="card-icon">${emoji}</div>
      <div class="card-title">${title}</div>
      <div class="big-number">${data.total_km || 0}<span class="big-unit">km</span></div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-mute);margin-bottom:16px">${data.sessions} session${data.sessions !== 1 ? 's' : ''}</div>
      ${data.avg_pace_fmt ? `<div class="stat-row"><span class="stat-key">Avg pace</span><span class="stat-val">${data.avg_pace_fmt}</span></div>` : ''}
      ${data.total_elevation_m ? `<div class="stat-row"><span class="stat-key">Elevation</span><span class="stat-val">${val(data.total_elevation_m, ' m')}</span></div>` : ''}
      ${data.longest_km > 0 && data.sessions > 1 ? `<div class="stat-row"><span class="stat-key">Longest</span><span class="stat-val">${val(data.longest_km, ' km')}</span></div>` : ''}
      <div class="stat-row"><span class="stat-key">Total time</span><span class="stat-val">${fmtTime(data.total_duration_min)}</span></div>
    </div>
  `;
}

function strengthCard(data) {
  if (!data || data.sessions === 0) return '';
  return `
    <div class="report-card">
      <div class="card-icon">🏋</div>
      <div class="card-title">Strength</div>
      <div class="big-number">${data.sessions}<span class="big-unit">session${data.sessions !== 1 ? 's' : ''}</span></div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-mute);margin-bottom:16px">strength training</div>
      <div class="stat-row"><span class="stat-key">Total time</span><span class="stat-val">${fmtTime(data.total_duration_min)}</span></div>
    </div>
  `;
}

const PR_LABELS = {
  longest_run: v => `Longest run · ${(v/1000).toFixed(1)} km`,
  highest_elevation: v => `Highest elevation · ${Math.round(v)} m`,
  longest_duration: v => `Longest duration · ${Math.round(v/60)} min`,
  best_avg_pace: v => {
    const s = Math.abs(v); const m = Math.floor(s/60), sec = Math.round(s%60);
    return `Best pace · ${m}'${String(sec).padStart(2,'0')}"/km`;
  },
};

function render(d) {
  const r = d.running, w = d.walking, c = d.cycling, sw = d.swimming, st = d.strength;
  const s = d.sleep, rec = d.recovery, t = d.totals;
  const cmp = d.comparison || {};
  const noGarmin = (s.nights_tracked === 0 && rec.days_tracked === 0)
    ? '<p class="no-garmin">No Garmin data this week. Sleep + HRV data appears once Garmin is connected and activities are synced.</p>'
    : '';

  // --- Highlight banner ---
  const highlightBlock = d.highlight ? `
    <div class="highlight">
      <div class="h-icon">✨</div>
      <div>
        <div class="h-label">Highlight</div>
        <div class="h-text">${d.highlight}</div>
      </div>
    </div>` : '';

  // --- Comparison strip ---
  const cmpItems = [];
  if (cmp.total_activities_delta !== undefined) {
    cmpItems.push(`<div class="cmp-item"><span class="cmp-key">Sessions</span><span class="cmp-val">${t.total_activities}</span>${deltaSpan(cmp.total_activities_delta)}</div>`);
  }
  if (cmp.active_days_delta !== undefined) {
    cmpItems.push(`<div class="cmp-item"><span class="cmp-key">Active days</span><span class="cmp-val">${t.active_days}/7</span>${deltaSpan(cmp.active_days_delta)}</div>`);
  }
  if (cmp.total_calories_delta !== undefined && t.total_calories > 0) {
    cmpItems.push(`<div class="cmp-item"><span class="cmp-key">Calories</span><span class="cmp-val">${t.total_calories.toLocaleString()}</span>${deltaSpan(cmp.total_calories_delta, ' kcal')}</div>`);
  }
  if (cmp.running_km_delta !== undefined && r.sessions > 0) {
    cmpItems.push(`<div class="cmp-item"><span class="cmp-key">Running km</span><span class="cmp-val">${r.total_km}</span>${deltaSpan(cmp.running_km_delta, ' km')}</div>`);
  }
  const comparisonBlock = cmpItems.length > 0 ? `
    <div class="comparison">
      <div class="cmp-title">📊 This week vs last</div>
      <div class="cmp-grid">${cmpItems.join('')}</div>
    </div>` : '';

  // --- Sport cards (only show sports with data) ---
  const sportCards = [
    distanceCard('🏃', 'Running', r),
    distanceCard('🚶', 'Walking', w),
    distanceCard('🚴', 'Cycling', c),
    distanceCard('🏊', 'Swimming', sw),
    strengthCard(st),
  ].filter(s => s).join('');
  const sportsBlock = sportCards
    ? `<div class="sports-grid">${sportCards}</div>`
    : `<div class="report-card" style="margin-bottom:16px"><p class="no-data">No activities this week.</p></div>`;

  // --- Sleep + Recovery ---
  const sleepRecBlock = `
    <div class="grid-2x2">
      <div class="report-card">
        <div class="card-icon">😴</div>
        <div class="card-title">Sleep Quality</div>
        ${s.nights_tracked === 0 ? `<p class="no-data">No sleep data.</p>${noGarmin}` : `
          <div class="big-number" style="color:${s.avg_score >= 75 ? 'var(--tertiary)' : s.avg_score >= 55 ? 'var(--warn)' : 'var(--primary)'}">
            ${s.avg_score}<span class="big-unit">/ 100</span>
          </div>
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-mute);margin-bottom:16px">avg Garmin sleep score</div>
          <div class="stat-row"><span class="stat-key">Nights tracked</span><span class="stat-val">${s.nights_tracked}</span></div>
          ${cmp.sleep_score_delta !== undefined && cmp.sleep_score_delta !== 0 ? `<div class="stat-row"><span class="stat-key">vs last week</span><span class="stat-val">${deltaSpan(cmp.sleep_score_delta)}</span></div>` : ''}
        `}
      </div>
      <div class="report-card">
        <div class="card-icon">💚</div>
        <div class="card-title">Recovery & HRV</div>
        ${rec.days_tracked === 0 ? `<p class="no-data">No recovery data.</p>${noGarmin}` : `
          <div class="big-number" style="color:${rec.avg_body_battery >= 70 ? 'var(--tertiary)' : rec.avg_body_battery >= 40 ? 'var(--warn)' : 'var(--primary)'}">
            ${rec.avg_body_battery ?? '—'}<span class="big-unit">/ 100</span>
          </div>
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-mute);margin-bottom:12px">avg body battery at workout start</div>
          ${renderHRV(rec.hrv_breakdown)}
        `}
      </div>
    </div>
  `;

  // --- PRs broken this week ---
  const prsBlock = (d.prs && d.prs.length > 0) ? `
    <div class="prs-card">
      <div class="card-title" style="margin-bottom:12px;color:var(--warn)">🏆 Personal Records Broken</div>
      ${d.prs.map(pr => {
        const fn = PR_LABELS[pr.metric] || (v => `${pr.metric}: ${v}`);
        return `<div class="pr-row"><span class="pr-name">${fn(pr.value).split(' · ')[0]}</span><span class="pr-value">${fn(pr.value).split(' · ')[1] || pr.value}</span></div>`;
      }).join('')}
    </div>` : '';

  // --- Day-by-day ---
  const dailyBlock = (d.daily && d.daily.length > 0) ? `
    <div class="daily-card">
      <div class="card-title" style="margin-bottom:12px">📅 Day-by-day</div>
      <div class="daily-grid">
        ${d.daily.map(day => `
          <div class="day-row${day.activities === 0 ? ' rest' : ''}">
            <div class="day-name">${day.day}</div>
            <div class="day-summary">${day.summary}</div>
            <div class="day-duration">${day.activities > 0 ? day.total_duration_min + ' min' : ''}</div>
          </div>
        `).join('')}
      </div>
    </div>` : '';

  // --- Summary bar ---
  const summaryBlock = `
    <div class="summary-row">
      <div class="summary-cell">
        <div class="label">Active days</div>
        <div class="numeric" style="font-size:28px;margin-top:8px">${t.active_days}<span style="font-family:var(--font-mono);font-size:11px;color:var(--text-mute);margin-left:4px">/ 7</span></div>
      </div>
      <div class="summary-cell">
        <div class="label">Activities</div>
        <div class="numeric" style="font-size:28px;margin-top:8px">${t.total_activities}</div>
      </div>
      <div class="summary-cell">
        <div class="label">Calories</div>
        <div class="numeric" style="font-size:28px;margin-top:8px">${t.total_calories.toLocaleString()}<span style="font-family:var(--font-mono);font-size:11px;color:var(--text-mute);margin-left:4px">kcal</span></div>
      </div>
      <div class="summary-cell">
        <div class="label">Total time</div>
        <div class="numeric" style="font-size:28px;margin-top:8px">${t.total_duration_min}<span style="font-family:var(--font-mono);font-size:11px;color:var(--text-mute);margin-left:4px">min</span></div>
      </div>
    </div>
  `;

  return highlightBlock + comparisonBlock + sportsBlock + sleepRecBlock + prsBlock + dailyBlock + summaryBlock;
}

document.getElementById('btn-prev').addEventListener('click', () => { weekOffset--; loadWeek(); });
document.getElementById('btn-next').addEventListener('click', () => { if (weekOffset < 0) { weekOffset++; loadWeek(); } });
document.getElementById('btn-pdf').addEventListener('click', () => {
  if (!userId) return;
  window.location.href = `/report/pdf?user_id=${userId}&week_offset=${weekOffset}`;
});

document.getElementById('btn-wa').addEventListener('click', async () => {
  if (!userId) return;
  const btn = document.getElementById('btn-wa');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const r = await fetch(`/report/whatsapp?user_id=${userId}&week_offset=${weekOffset}`, { method: 'POST' });
    const j = await r.json();
    if (j.status === 'sent') {
      btn.textContent = '✓ Sent';
      setTimeout(() => { btn.textContent = '✈ WhatsApp'; btn.disabled = false; }, 2000);
    } else {
      btn.textContent = '✗ Failed';
      alert('WhatsApp send failed. Check Twilio settings in .env (account SID, auth token, from, to).');
      setTimeout(() => { btn.textContent = '✈ WhatsApp'; btn.disabled = false; }, 2000);
    }
  } catch (e) {
    btn.textContent = '✗ Failed';
    setTimeout(() => { btn.textContent = '✈ WhatsApp'; btn.disabled = false; }, 2000);
  }
});

init();
</script>
</body>
</html>
